# Publishes python-plotto to PyPI and plotto to npm when a tag vX.Y.Z is pushed.
# Setup (once): trusted publishing on PyPI and on npm, for this repo and workflow. See README, "Release".
name: release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: npm ci
      - run: npm test
      - name: Verify that the tag, package.json and the Python version agree
        run: |
          tag=${GITHUB_REF_NAME#v}
          test "$tag" = "$(node -p 'require("./package.json").version')"
          test "$tag" = "$(python -c 'import re; print(re.search(r"__version__ = \"(.+)\"", open("python/plotto/__init__.py").read())[1])')"
      - run: npm run build:python
      - run: pip install build && python -m build python --outdir dist
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist }

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    needs: build
    runs-on: ubuntu-latest
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - run: npm ci
      # Trusted publishing (no token) needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      # The first version is published by hand (npm cannot set up trusted publishing before the package exists).
      - name: Publish, unless this version is already on npm
        run: |
          version=$(node -p 'require("./package.json").version')
          if npm view "plotto@$version" version >/dev/null 2>&1; then echo "plotto@$version is already on npm"; else npm publish --provenance --access public; fi
