# Tests on pushes to main and on pull requests. Changes to the site (docs/) or the Markdown files alone do not run it.
name: ci
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
# A newer push cancels the run of an older one on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: python/pyproject.toml }
      - run: npm ci
      - run: npm test
      - run: CHROME=$(which google-chrome) npm run browser-test
      - run: pip install -e "python[test]"
      - run: pytest python/tests
      - run: ruff check . && black --check .
